name: Tourism Project Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # Allows pushing the best_model_v1.joblib back to the repo

jobs:
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
          cache: 'pip' # Speeds up consecutive dependency installations

      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt

      - name: Register Dataset
        run: python tourism_project/model_building/data_register.py

      # FIX: Uploading the newly generated data folder so data-prep can use it
      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt

      # FIX: Restoring data directory context from the register-dataset job
      - name: Download Registered Dataset
        uses: actions/download-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/

      # Run preprocessing script which populates the root or project directories
      - name: Run Data Preparation
        run: python tourism_project/model_building/prep.py

      # FIX: Capturing splits correctly regardless of whether they drop in root or nested folder
      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            *.csv
            tourism_project/data/*.csv

  model-training: # FIX: Corrected typo from model-traning
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt

      # FIX: Unpacking the splits into the root directory explicitly so train.py finds them
      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: .

      - name: Start MLflow Server
        run: |
          nohup mlflow ui --host 0.0.0.0 --port 5000 &
          sleep 5

      # FIX: Ensuring target directory exists before running train.py to avoid FileNotFoundError
      - name: Create Deployment Directory
        run: mkdir -p tourism_project/deployment

      - name: Model Building
        run: python tourism_project/model_building/train.py

      # FIX: Using GITHUB_TOKEN to securely authenticate the push back to the repository
      - name: Commit and Push Trained Model
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "sowm-dev"
          git config user.email "sowmyaravichandran79@gmail.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@://github.com{{ github.repository }}.git
          git add tourism_project/deployment/best_model_v1.joblib
          git commit -m "Add trained model [skip ci]" || echo "No changes to commit"
          git push origin main
